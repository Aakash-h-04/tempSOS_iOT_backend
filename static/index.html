<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Green AI
    </title>


    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>


    <!-- ==================================================
         MAIN CONTAINER
         ================================================== -->

    <main class="container">


        <!-- ==============================================
             HEADER
             ============================================== -->

        <header class="header">

            <h1>
                GREEN AI
            </h1>

            <p>
                4 × 4 Tic-Tac-Toe AI
            </p>

        </header>


        <!-- ==============================================
             BOARD LEGEND
             ============================================== -->

        <section class="legend">

            <span>
                ❌ YOU — RED
            </span>
            
            <span>
                🟢 AI — GREEN
            </span>

        </section>


        <!-- ==============================================
             GAME BOARD
             ============================================== -->

        <section
            class="board"
            id="board"
        >


            <!-- Cells will be created by JavaScript -->


        </section>


        <!-- ==============================================
             FIND BEST MOVE BUTTON
             ============================================== -->

        <button
            id="findMoveButton"
            style="display: none;"
        >

            FIND BEST GREEN MOVE

        </button>


        <!-- ==============================================
        NEW GAME BUTTON
        ============================================== -->

        <button id="newGameButton">

            NEW GAME

        </button>


        <!-- ==============================================
             RESULT AREA
             ============================================== -->

        <section
            class="result"
            id="result"
        >

            <p>
                ❌ Your turn — make the first move.
            </p>

        </section>


    </main>


    <!-- 
    ===================================================
    JAVASCRIPT
    ==================================================
    -->

        <script
         src="/static/script.js"
     ></script>


</body>

</html>
